<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pancake City · Barrel-vault benchmark</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#edf0f1;color:#182628;font:15px system-ui,sans-serif}header{padding:14px 20px;background:#f8f9f9;border-bottom:1px solid #d6dedf;display:flex;align-items:center;gap:8px;flex-wrap:wrap}h1{font-size:17px;margin:0 auto 0 0}button{font:inherit;padding:7px 11px;border:1px solid #9dacad;border-radius:5px;background:white;color:inherit;cursor:pointer}button[aria-pressed=true]{background:#183d3a;color:white}main{padding:12px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}figure{margin:0;background:white;min-width:0}figcaption{padding:8px 12px;font-weight:650;border-bottom:1px solid #e5eaea}.image,#view{display:block;height:min(calc(100vh - 125px),calc((100vw - 36px)/2));min-height:240px;width:100%;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:none}footer{padding:0 14px 12px;color:#455556;font-size:13px}#source,#metrics{display:none}@media(max-width:650px){main{display:block}figure{margin-bottom:8px}.image,#view{height:90vw}}
</style>
</head>
<body>
<header>
<h1>Barrel-vault skyscraper benchmark</h1>
<button id="matched">Matched view</button>
<button id="crown">Crown</button>
<button id="entrance">Entrance</button>
</header>
<main>
<figure><figcaption>Reference</figcaption><canvas class="image" id="reference" aria-label="Attached reference image"></canvas></figure>
<figure><figcaption>Fixed 3D reconstruction</figcaption><div id="view" aria-label="Interactive building model"></div></figure>
</main>
<footer id="status">Drag to orbit. Scroll to zoom.</footer>
<img id="source" src="reference.png" alt="">
<output id="metrics"></output>
<script type="module" src="review.js"></script>
</body>
</html>
